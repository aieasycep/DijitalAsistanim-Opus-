# Supabase local development configuration for Dijital Asistan.
# Remote (hosted) settings are managed in the dashboard; this file drives `supabase start`.

project_id = "dijital-asistan"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
schema_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Local-only mail catcher; nothing leaves the machine during development.
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.captures]
public = false
file_size_limit = "25MiB"
allowed_mime_types = [
  "image/jpeg",
  "image/png",
  "image/heic",
  "image/heif",
  "image/webp",
  "application/pdf",
  "text/plain",
]

[storage.buckets.exports]
public = false
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "env(SUPABASE_AUTH_SITE_URL)"
additional_redirect_urls = ["env(SUPABASE_AUTH_ADDITIONAL_REDIRECT_URLS)"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = "env(GOOGLE_OAUTH_REDIRECT_URI)"
skip_nonce_check = false

[auth.external.azure]
enabled = true
client_id = "env(MICROSOFT_OAUTH_CLIENT_ID)"
secret = "env(MICROSOFT_OAUTH_CLIENT_SECRET)"
redirect_uri = "env(MICROSOFT_OAUTH_REDIRECT_URI)"
url = "env(MICROSOFT_OAUTH_TENANT_URL)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_OAUTH_CLIENT_ID)"
secret = "env(APPLE_OAUTH_SECRET)"
redirect_uri = "env(APPLE_OAUTH_REDIRECT_URI)"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
