name: iOS build

# Compiles the iOS app — the whole native project, including the two config
# plugins nobody has ever compiled — on a GitHub macOS runner.
#
# WHAT YOU GET, AND WHAT YOU DO NOT
#   You get a simulator build: a `.app` that runs in Xcode's iOS Simulator on a
#   Mac. You do NOT get something installable on an iPhone, and that is not a
#   limitation of this workflow.
#
#   Android lets a throwaway key sign a release and `adb install` accepts it.
#   iOS has no equivalent: every binary that runs on a device carries a
#   signature from a certificate issued by Apple, tied to a provisioning
#   profile that names either the device or a TestFlight distribution. Both
#   need a paid Apple Developer Program membership. On top of that, this app's
#   share extension and widget both declare the App Group
#   `group.com.dijitalasistan.app`, and App Groups are not available to the
#   free personal team at all — so even the seven-day free-provisioning route
#   would strip the widget.
#
#   So: this workflow proves the code compiles. Putting it on a phone is a
#   separate, paid step (TestFlight), and nothing here pretends otherwise.
#
# WHY IT IS STILL WORTH RUNNING
#   The iOS native project is generated from app.config.ts by four config
#   plugins and is not checked in. Until this ran, nothing in CI had ever
#   invoked the Swift compiler on any of it. That is precisely the shape of the
#   defect that stopped the Android build five times in a row: every gate green
#   against an app that could not actually be built.
#
# HOW TO RUN IT
#   Actions → "iOS build" → Run workflow. Or push a commit whose message
#   contains "[ios]".

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Release also builds the JS bundle into the app; Debug does not.'
        type: choice
        default: 'Release'
        options: ['Release', 'Debug']
  push:
    branches: ['claude/**']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build for the simulator
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    # macos-15 ships Xcode 16.4, whose Swift is 6.1. Expo SDK 57 builds
    # ExpoModulesJSI from an SPM package declaring `swift-tools-version: 6.2`,
    # so package resolution fails there before a line of it compiles:
    # "package 'apple' is using Swift tools version 6.2.0 but the installed
    # version is 6.1.0". 6.2 arrives with Xcode 26. The guard below turns that
    # into one legible sentence if an image ever rolls back under us.
    runs-on: macos-26
    timeout-minutes: 90

    env:
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Printed rather than assumed. React Native 0.86 needs a recent Xcode,
      # and a runner image rolling forward is the kind of change that turns a
      # green build red with no commit behind it — this line is what makes that
      # legible in the log.
      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version
          pod --version
          node --version
          sw_vers
          echo "## Xcode versions on this image"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Expo builds two of its own SPM packages during the Xcode build, and a
      # package whose swift-tools-version exceeds the toolchain fails at
      # *resolution* — no source is compiled, and the message lands in the
      # middle of an eleven-thousand-line transcript. Comparing the two numbers
      # here costs a second and says the same thing in one line, before pods.
      - name: Check Swift is new enough for Expo's SPM packages
        run: |
          set -uo pipefail
          required=$(find node_modules/.pnpm -maxdepth 6 -name Package.swift -path '*expo*' -exec head -1 {} \; \
            | sed -nE 's|^// *swift-tools-version: *([0-9]+\.[0-9]+).*|\1|p' \
            | sort -V | tail -1)
          installed=$(swift --version 2>&1 | sed -nE 's/.*[Ss]wift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)
          echo "Expo's SPM packages need Swift tools $required; this toolchain is $installed."
          if [ -z "$required" ] || [ -z "$installed" ]; then
            echo "::warning::Could not read one of the two versions, so nothing was checked."
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$required" "$installed" | sort -V | head -1)" != "$required" ]; then
            echo "::error::Swift $installed is older than the $required that expo-modules-jsi requires. Package resolution will fail. Use a runner image whose Xcode carries Swift $required or newer."
            exit 1
          fi

      # Generates apps/mobile/ios from app.config.ts and the config plugins.
      # --no-install keeps CocoaPods out of this step so a plugin failure and a
      # pod failure cannot be mistaken for each other.
      - name: Prebuild the iOS project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      # The two iOS plugins write their target directories during prebuild. If
      # a plugin silently no-ops — the failure mode its own code guards against
      # — the Xcode project is still valid and still builds, just without the
      # feature. Cheaper to catch here than to wonder later why the widget is
      # missing from a build that succeeded.
      - name: Check the plugins produced their targets
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          missing=0
          for target in DijitalAsistanShare DijitalAsistanWidget; do
            if [ -d "$target" ]; then
              echo "ok: $target/"
            else
              echo "::error::prebuild produced no $target directory; the config plugin did not run."
              missing=1
            fi
          done
          PBX=$(find . -name project.pbxproj | head -1)
          for target in DijitalAsistanShare DijitalAsistanWidget; do
            if grep -q "$target" "$PBX"; then
              echo "ok: $target is referenced by the Xcode project"
            else
              echo "::error::$target exists on disk but no Xcode target references it."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install || pod install --repo-update

      # The scheme name is derived from the app's display name by prebuild, so
      # it is read back from the project rather than hardcoded — renaming the
      # app should not silently break the build.
      #
      # It must equal the workspace name, and nothing else will do. A CocoaPods
      # workspace lists a scheme for every pod and every local Expo module, and
      # picking any of them builds a library rather than the app: the first
      # attempt here took the first entry that did not look like a pod, got
      # `DaNative` — this project's own native module — and failed 25 seconds
      # in. Guessing is what produced that, so this no longer guesses.
      - name: Resolve the workspace and scheme
        id: xcode
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          test -n "$WORKSPACE"
          BASE=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE (app scheme must be '$BASE')"

          xcodebuild -list -json -workspace "$WORKSPACE" > /tmp/schemes.json
          echo "## Schemes in the workspace"
          node -e 'const l=require("/tmp/schemes.json").workspace.schemes;console.log(l.join("\n"))'

          if ! node -e 'const l=require("/tmp/schemes.json").workspace.schemes;process.exit(l.includes(process.argv[1])?0:1)' "$BASE"; then
            echo "::error::No scheme named '$BASE' in $WORKSPACE. The app scheme always carries the project name, so prebuild produced something unexpected — see the list above."
            exit 1
          fi

          echo "Scheme:    $BASE"
          echo "workspace=apps/mobile/ios/${WORKSPACE#./}" >> "$GITHUB_OUTPUT"
          echo "scheme=$BASE" >> "$GITHUB_OUTPUT"

      # CODE_SIGNING_ALLOWED=NO is what makes this possible without an Apple
      # account: the simulator does not enforce signatures, so the entitlements
      # the app and both extensions declare are compiled but never validated.
      #
      # The whole transcript goes to a file and only an extract is printed. An
      # xcodebuild log is tens of megabytes of clang invocations, each one a
      # single line thousands of characters wide, and the diagnosis is four
      # lines somewhere inside it. Printing the extract *last* is deliberate:
      # it is the part that survives when only the tail of a log can be read.
      - name: Build
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          LOG="$RUNNER_TEMP/logs/xcodebuild.log"

          # `|| status=$?` rather than a bare call: GitHub runs step scripts as
          # `bash -e`, and `set -uo pipefail` does not clear an -e that is
          # already in effect. The first attempt at this step read `status=$?`
          # on the next line and never reached it — the shell died on the
          # non-zero exit and every line of diagnosis below was skipped. A
          # command on the left of `||` is exempt from -e.
          status=0
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration "$CONFIGURATION" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$LOG" 2>&1 || status=$?

          echo "xcodebuild exited $status; full log is the 'ios-build-log' artifact ($(wc -l < "$LOG") lines)."
          if [ "$status" -eq 0 ]; then
            grep -E '^\*\* BUILD SUCCEEDED' "$LOG" || true
            exit 0
          fi

          echo ""
          echo "=============== diagnostics ==============="
          echo "--- ExpoModulesJSI script phase ---"
          grep -nE '\[ExpoModulesJSI\]|Build ExpoModulesJSI xcframework' "$LOG" | head -30 || echo "(nothing)"

          echo ""
          echo "--- context around the first error ---"
          # `|| true` for the same reason as above: grep finding nothing exits
          # 1, and under -e an assignment from a failing substitution ends the
          # script — taking the fallback branch, the one that matters when
          # there is no `error:` line at all, with it.
          first=$(grep -nE 'error:|fatal error' "$LOG" | head -1 | cut -d: -f1 || true)
          if [ -n "${first:-}" ]; then
            start=$(( first > 15 ? first - 15 : 1 ))
            sed -n "${start},$((first + 20))p" "$LOG" | cut -c1-200 || true
          else
            echo "No 'error:' line at all — the last 80 lines instead:"
            tail -80 "$LOG" | cut -c1-200 || true
          fi

          # Deliberately last. Only the tail of a run's log can be read back
          # through the API here — the archive lives on storage this network
          # refuses — so the single most useful section is the one printed
          # closest to the end.
          echo ""
          echo "--- every error line ---"
          grep -nE 'error:|fatal error|No such module|command not found|The following build commands failed' "$LOG" \
            | grep -v 'clang: note' | cut -c1-300 | head -40 || echo "(no line matched 'error:')"
          exit "$status"

      - name: Keep the build log whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/logs/xcodebuild.log
          retention-days: 14
          if-no-files-found: warn

      # Read the result off the finished bundle rather than trusting that the
      # build phases ran. A Release app whose JS bundle never got compiled in
      # launches to a permanently blank screen and looks perfect in the log —
      # the Android equivalent of this check is the one that caught a release
      # signed with the public debug key.
      - name: Inspect the built app
        id: inspect
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APP")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -sh "$APP" | cut -f1)" >> "$GITHUB_OUTPUT"

          echo "## Bundle contents"
          ls -la "$APP"

          echo "## Embedded extensions"
          APPEX=$(find "$APP" -name '*.appex' -maxdepth 3 -type d || true)
          echo "${APPEX:-(none)}"

          failed=0
          for target in DijitalAsistanShare DijitalAsistanWidget; do
            if echo "$APPEX" | grep -q "$target.appex"; then
              echo "ok: $target.appex is embedded"
            else
              echo "::error::$target.appex was not embedded in the app; the extension built but never shipped."
              failed=1
            fi
          done

          # Debug simulator builds deliberately load JS from Metro instead of
          # embedding it, so the bundle is only required for Release.
          if [ "$CONFIGURATION" = "Release" ]; then
            if [ -f "$APP/main.jsbundle" ]; then
              echo "ok: main.jsbundle is present ($(du -h "$APP/main.jsbundle" | cut -f1))"
            else
              echo "::error::Release build contains no main.jsbundle; the app would open to a blank screen."
              failed=1
            fi
          fi
          exit "$failed"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.inspect.outputs.app }}" \
            "dist/dijital-asistan-simulator-${{ github.sha }}.app.zip"
          ls -la dist

      - name: Summary
        run: |
          {
            echo "### iOS simulator build"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Configuration | ${{ env.CONFIGURATION }} |"
            echo "| Scheme | ${{ steps.xcode.outputs.scheme }} |"
            echo "| App | ${{ steps.inspect.outputs.name }} (${{ steps.inspect.outputs.size }}) |"
            echo ""
            echo "The whole native project compiled, both app extensions were built and embedded."
            echo ""
            echo "**This does not install on an iPhone.** iOS requires an Apple-issued signing"
            echo "certificate and a provisioning profile for any on-device install, and this app's"
            echo "App Group rules out the free personal team. To run it:"
            echo ""
            echo '```bash'
            echo "unzip dijital-asistan-simulator-<sha>.app.zip"
            echo "xcrun simctl boot 'iPhone 16'"
            echo "open -a Simulator"
            echo "xcrun simctl install booted ${{ steps.inspect.outputs.name }}"
            echo "xcrun simctl launch booted com.dijitalasistan.app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dijital-asistan-ios-simulator
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: error
