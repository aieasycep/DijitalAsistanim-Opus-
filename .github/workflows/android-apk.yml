name: Android APK

# Builds an installable APK on GitHub's runners and attaches it to the run.
#
# This exists because an APK cannot be produced without the Android SDK, and
# `dl.google.com` — which serves the SDK, the platform images and Google's
# Maven repo (the Android Gradle Plugin itself) — is not reachable from every
# development environment. GitHub's ubuntu runners ship the SDK preinstalled,
# so this is the shortest path from a commit to something you can install.
#
# HOW TO GET THE APK
#   1. Actions → "Android APK" → "Run workflow" (or push to a branch).
#   2. Open the finished run → Artifacts → download "dijital-asistan-apk".
#   3. Unzip, copy the .apk to the phone, install (allow unknown sources).
#
# SIGNING
#   The APK is signed with a keystore generated inside the run, unless you
#   supply your own through repository secrets. A generated key is fine for
#   installing and testing, and deliberately NOT fine for the Play Store: its
#   signature changes every run, so consecutive builds cannot upgrade each
#   other in place. Uninstall before installing a newer one, or add the
#   secrets below to keep one stable identity.
#
#     ANDROID_KEYSTORE_BASE64   base64 of your .jks
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        type: choice
        default: 'release'
        options: ['release', 'debug']
  push:
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates apps/mobile/android from app.config.ts and the config
      # plugins. Neither the android/ nor the ios/ directory is checked in, so
      # this is where a broken plugin surfaces.
      - name: Prebuild the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          # The app boots into demo mode when these are absent, which is
          # exactly what a first test build should do.
          EXPO_NO_TELEMETRY: '1'

      # Secrets arrive through `env` rather than `${{ }}` inside the script: an
      # expression is substituted into the shell source before it runs, so a
      # value containing a quote would be executed rather than compared.
      - name: Resolve the signing key
        id: signing
        working-directory: apps/mobile/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
            echo "provided=true" >> "$GITHUB_OUTPUT"
            echo "Using the keystore from repository secrets."
          else
            # A throwaway identity, good for installing and testing only.
            keytool -genkeypair -v -storetype JKS \
              -keystore release.jks \
              -alias throwaway \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=Dijital Asistan Test, OU=Test, O=Dijital Asistan, L=Istanbul, C=TR"
            store_password=throwaway
            key_alias=throwaway
            key_password=throwaway
            echo "provided=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed with a generated throwaway key. Uninstall any previous build before installing this one."
          fi
          # Delimited form, so a value containing a newline cannot append
          # arbitrary variables to the environment file.
          {
            echo "DA_UPLOAD_STORE_FILE=release.jks"
            for pair in "DA_UPLOAD_STORE_PASSWORD:$store_password" \
                        "DA_UPLOAD_KEY_ALIAS:$key_alias" \
                        "DA_UPLOAD_KEY_PASSWORD:$key_password"; do
              echo "${pair%%:*}<<__DA_SIGNING_EOF__"
              echo "${pair#*:}"
              echo "__DA_SIGNING_EOF__"
            done
          } >> "$GITHUB_ENV"

      # Two files have to agree — gradle.properties must carry the four values,
      # and app/build.gradle must both declare a release signingConfig AND
      # repoint buildTypes.release at it. Expo's template ships neither: its
      # gradle.properties has no trailing newline (so a plain append corrupts
      # the last property) and its release variant signs with the DEBUG
      # keystore, whose private key is public. Doing only half the job produces
      # a build that succeeds and is signed with the wrong key, so the script
      # verifies its own result and its self-test runs against the genuine
      # generated template rather than an invented one.
      - name: Configure release signing
        run: |
          node scripts/ci/configure-android-signing.mjs --self-test
          node scripts/ci/configure-android-signing.mjs apps/mobile/android

      - name: Assemble
        working-directory: apps/mobile/android
        run: |
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          if [ "$VARIANT" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/dijital-asistan-${{ github.sha }}.apk"
          ls -la dist
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "apk=dist/dijital-asistan-${{ github.sha }}.apk" >> "$GITHUB_OUTPUT"

      # Read the signature back off the finished APK rather than trusting the
      # configuration that produced it. A release build signed with the
      # template's debug key installs and runs perfectly and is visible nowhere
      # in a build log — this is the step that makes it visible. `CN=Android
      # Debug` is the certificate every React Native project ships and whose
      # private key is public, so a release variant carrying it is a failure.
      - name: Verify the signature and the permissions
        run: |
          set -euo pipefail
          APK="${{ steps.collect.outputs.apk }}"
          VARIANT="${{ github.event.inputs.variant || 'release' }}"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          test -n "$BUILD_TOOLS"

          echo "## Signature"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if [ "$VARIANT" != "debug" ] && echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with the template's public debug key."
            exit 1
          fi

          # The manifest merger is the only thing that actually applies
          # `tools:node="remove"`, and it runs inside Gradle. Reading the
          # permissions back off the finished APK is the only way to know it
          # did. SYSTEM_ALERT_WINDOW — "draw over other apps" — is contributed
          # by the template and blocked in app.config.ts; if it reappears here,
          # the block silently stopped working and the release is asking a
          # person for something it does not use.
          echo "## Permissions"
          PERMISSIONS=$("$BUILD_TOOLS/aapt2" dump permissions "$APK")
          echo "$PERMISSIONS"
          if [ "$VARIANT" != "debug" ] && echo "$PERMISSIONS" | grep -q 'SYSTEM_ALERT_WINDOW'; then
            echo "::error::The release APK requests SYSTEM_ALERT_WINDOW, which this app does not use."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### APK ready"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Size: ${{ steps.collect.outputs.size }}"
            echo "- Signed with: ${{ steps.signing.outputs.provided == 'true' && 'your keystore' || 'a generated throwaway key' }}"
            echo ""
            echo "Download it from the **Artifacts** section of this run, then install it on the phone."
            echo "With no Supabase project configured the app opens in demo mode, so it is testable immediately."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dijital-asistan-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
