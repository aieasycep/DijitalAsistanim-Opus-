name: CI

# Every gate that `pnpm verify` runs locally, run again on every push and pull
# request. The jobs are split so a failure names itself: "types" failing is a
# different conversation from "database" failing, and a contributor should not
# have to read a 400-line log to find out which.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI talks to a real project. Every integration has a local
  # fallback, so the absence of these is the tested configuration, not a gap.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Types
        run: pnpm run typecheck

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Shared packages and edge-function helpers
        run: pnpm run test

      - name: React Native components
        run: pnpm run test:mobile

  guards:
    name: Product and security guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Turkish and English define the same keys, every key the app asks for
      # exists, and no string claims end-to-end encryption.
      - name: Message catalogue
        run: pnpm run verify:i18n

      # No unfinished-work markers, no control that looks pressable and is not.
      - name: Dead code and dead controls
        run: pnpm run verify:no-dead-code

      # No committed credential, and no server secret referenced from a bundle.
      - name: Secrets
        run: pnpm run verify:secrets

      # Every element the end-to-end flows reach for is one the app renders.
      # This proves the ids EXIST in source; it does not prove a flow runs.
      - name: End-to-end flow targets
        run: pnpm run verify:e2e-ids

      # Every edge-function slug and every navigation target resolves to
      # something on disk. None of the defects this catches is a type error:
      # a string naming an absent function or route looks exactly like one
      # naming a present one, which is how five scheduled jobs, a missing
      # endpoint and the home screen's primary button all shipped broken.
      - name: Wiring
        run: pnpm run verify:wiring

      # The role/permission matrix in docs/BACKOFFICE_RBAC.md, re-derived from
      # 0019_admin_platform.sql and compared cell by cell. A matrix document
      # that silently goes stale is worse than none, because people plan around
      # it and reviewers cite it.
      - name: RBAC document
        run: pnpm run verify:rbac-doc

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql-client

      - name: Install
        run: pnpm install --frozen-lockfile

      # Applies every migration to an empty database, applies them a second
      # time to prove they are re-runnable, checks each Postgres enum against
      # the TypeScript union it mirrors, and asserts RLS is enabled *and*
      # forced on every user table.
      - name: Migrations, enums and RLS
        run: pnpm run verify:supabase
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres

  functions:
    name: Edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The functions import the shared packages as TypeScript source, so this
      # also proves those compile under Deno's checker and not just tsc's.
      - name: Type-check
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Lint
        run: deno lint --config supabase/functions/deno.json supabase/functions

  web:
    name: Marketing site build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:web

  backoffice:
    name: Backoffice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm --filter @da/backoffice run typecheck

      - name: Build
        run: pnpm run build:backoffice

  backoffice-e2e:
    name: Backoffice end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The same service the `database` job uses. The suite creates a scratch
    # database on it per run, applies every migration to it, seeds fixture data
    # and serves the console against it — so this job proves the console works
    # against the real schema, not against a mock of it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A runner has no browser. Development containers that ship one set
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD so `pnpm install` does not fetch a
      # second copy; turning it off for this step alone keeps that arrangement
      # working locally while CI still gets the browser it needs.
      - name: Install Chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
        run: pnpm --filter @da/backoffice exec playwright install --with-deps chromium

      - name: End-to-end suite
        run: pnpm run test:backoffice-e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # The report and the traces are how a failure here is diagnosed without
      # reproducing it; a green run uploads nothing.
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backoffice-e2e-report
          path: |
            apps/backoffice/playwright-report
            apps/backoffice/test-results
          retention-days: 7
          if-no-files-found: ignore

  mobile:
    name: Mobile app config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Resolves app.config.ts and every config plugin. A plugin that throws —
      # or emits a manifest entry that does not parse — fails here rather than
      # during a build on someone's machine.
      - name: Resolve Expo config
        run: pnpm run verify:mobile

      # The icons are generated from the design tokens rather than checked in
      # by hand, so a change to the palette that was not regenerated shows up
      # as a dirty tree.
      - name: Brand assets are up to date
        run: |
          pnpm run assets:generate
          git diff --exit-code -- apps/mobile/assets apps/web/src/app
