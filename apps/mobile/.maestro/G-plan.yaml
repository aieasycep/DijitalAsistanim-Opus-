# Flow G — the plan: day, week, conflicts and a suggestion.
#
# A suggestion that cannot be acted on is just an observation, so the flow
# presses one. Conflicts have to name the two events involved rather than
# saying "you have a clash" — which is why the demo calendar contains a real
# overlap: the committee pre-brief runs inside the last half hour of the
# product strategy meeting, so `plan-conflicts` has something to render.
appId: ${APP_ID}
name: G · Plan the day and the week
tags:
  - smoke
---
- runFlow: helpers/enter-demo.yaml
- tapOn: 'Planla'
- assertVisible:
    id: 'plan-range'

# Both ranges render.
- tapOn: 'Hafta'
- assertVisible:
    id: 'plan-range'
- tapOn: 'Gün'
- assertVisible:
    id: 'plan-range'

# An event on the timeline opens its detail.
- scrollUntilVisible:
    element:
      id: 'plan-event-.*'
    direction: DOWN
- tapOn:
    id: 'plan-event-.*'
- assertVisible:
    id: 'event-prep'
- tapOn:
    id: 'screen-header-back'

# The conflicts screen names the events in the clash, and each one opens.
- scrollUntilVisible:
    element:
      id: 'plan-conflicts'
    direction: UP
- tapOn:
    id: 'plan-conflicts'
- assertVisible:
    id: 'conflict-.*'
- tapOn:
    id: 'conflict-event-.*'
- assertVisible:
    id: 'event-prep'
- tapOn:
    id: 'screen-header-back'
- assertVisible:
    id: 'conflict-.*'
- tapOn:
    id: 'screen-header-back'
- assertVisible:
    id: 'plan-range'

# A suggestion can be accepted, and acting on it is an approval, not a write.
- scrollUntilVisible:
    element:
      id: 'plan-suggestion-accept-.*'
    direction: DOWN
- tapOn:
    id: 'plan-suggestion-accept-.*'
- assertVisible:
    id: 'approval-detail-card'
- scrollUntilVisible:
    element:
      text: 'Onayla'
    direction: DOWN
- assertVisible: 'Onayla'
