# Flow J — ask the assistant, and see a write come back as a proposal.
#
# The assistant answers from the person's own data and cites what it used. When
# a question implies a write, the answer must arrive as something to approve —
# never as something already done.
appId: ${APP_ID}
name: J · Assistant
tags:
  - smoke
---
- runFlow: helpers/enter-demo.yaml
- tapOn: 'Asistan'
- assertVisible:
    id: 'assistant-input'

# A starter question.
- tapOn:
    id: 'assistant-suggestion-.*'
- assertVisible:
    id: 'assistant-input'

# A typed question.
- tapOn:
    id: 'assistant-input'
- inputText: 'Bu hafta kime dönüş yapmam gerekiyor?'
- hideKeyboard
- tapOn:
    id: 'assistant-send'

# Search covers the same ground from the other direction.
- tapOn: 'Bugün'
- tapOn:
    id: 'today-search'
- tapOn:
    id: 'search-input'
- inputText: 'teklif'
- hideKeyboard
- tapOn:
    id: 'search-scope-.*'
- assertVisible:
    id: 'search-input'
