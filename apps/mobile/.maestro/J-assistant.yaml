# Flow J — ask the assistant, and reach the same ground through search.
#
# The assistant answers from the person's own data and cites what it used. When
# a question implies a write, the answer must arrive as something to approve —
# never as something already done.
appId: ${APP_ID}
name: J · Assistant
tags:
  - smoke
---
- runFlow: helpers/enter-demo.yaml
- tapOn: 'Asistan'
- assertVisible:
    id: 'assistant-input'

# A starter question answers, and the composer survives it.
- tapOn:
    id: 'assistant-suggestion-.*'
- assertVisible:
    id: 'assistant-input'

# A typed question.
- tapOn:
    id: 'assistant-input'
- inputText: 'Bu hafta kime dönüş yapmam gerekiyor?'
- hideKeyboard
- tapOn:
    id: 'assistant-send'
- assertVisible:
    id: 'assistant-input'

# Search covers the same ground from the other direction, and its hits open.
- tapOn: 'Bugün'
- tapOn:
    id: 'today-search'
- tapOn:
    id: 'search-input'
- inputText: 'teklif'
- hideKeyboard
- assertVisible:
    id: 'search-hit-.*'
- tapOn:
    id: 'search-scope-email'
- assertVisible:
    id: 'search-hit-.*'
- tapOn:
    id: 'search-hit-.*'
- scrollUntilVisible:
    element:
      id: 'thread-reply'
    direction: DOWN
- assertVisible:
    id: 'thread-reply'
- tapOn:
    id: 'screen-header-back'
