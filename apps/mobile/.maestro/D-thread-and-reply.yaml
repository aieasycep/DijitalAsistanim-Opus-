# Flow D — read a thread, draft a reply, and stop short of sending.
#
# The draft is written by the assistant and edited by the person. Nothing is
# sent from here: the send is an approval, which is flow E.
appId: ${APP_ID}
name: D · Thread and reply draft
tags:
  - smoke
---
- runFlow: helpers/enter-demo.yaml
- tapOn: 'Akış'
- assertVisible:
    id: 'flow-list'

# A filter narrows the list without emptying the screen, and "all" restores it.
- tapOn:
    id: 'flow-filter-important'
- assertVisible:
    id: 'thread-.*'
- tapOn:
    id: 'flow-filter-all'
- assertVisible:
    id: 'thread-.*'

- tapOn:
    id: 'thread-.*'

# The summary carries a feedback control. Recording a signal has no screen of
# its own, so what is checked is that it leaves the thread standing rather than
# dropping the reader somewhere else.
- assertVisible:
    id: 'summary-good'
- tapOn:
    id: 'summary-good'

- scrollUntilVisible:
    element:
      id: 'thread-reply'
    direction: DOWN
- assertVisible:
    id: 'thread-reply'
- tapOn:
    id: 'thread-reply'
- assertVisible:
    id: 'reply-body'

# The tone is selectable and the draft can be regenerated on an instruction.
- tapOn:
    id: 'reply-tone-friendly'
- assertVisible:
    id: 'reply-body'
- tapOn:
    id: 'reply-instruction'
- inputText: 'Daha kısa olsun'
- hideKeyboard
- tapOn:
    id: 'reply-regenerate'
- assertVisible:
    id: 'reply-body'

# The body is editable by hand.
- tapOn:
    id: 'reply-body'
- inputText: ' Teşekkürler.'
- hideKeyboard

# Discarding leaves without sending anything.
- assertVisible:
    id: 'reply-submit'
- tapOn:
    id: 'reply-discard'
- scrollUntilVisible:
    element:
      id: 'thread-reply'
    direction: DOWN
- assertVisible:
    id: 'thread-reply'
