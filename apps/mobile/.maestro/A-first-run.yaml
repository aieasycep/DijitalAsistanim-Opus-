# Flow A — first run: the intro, the sign-in choices, demo mode, and the tabs.
#
# The first screens a new person sees. What matters is that every route off
# them leads somewhere real, and that demo mode is reachable without an account.
#
# Google and Apple are deliberately not asserted here. `useSignIn` only offers a
# provider the build is configured for — Apple exists on iOS alone, Google needs
# a client id — so in a demo/CI build neither button is rendered at all, and a
# flow that insisted on them would be asserting a dead control into existence.
appId: ${APP_ID}
name: A · First run and demo mode
tags:
  - smoke
---
- launchApp:
    clearState: true

# The app opens on the intro pager, and both of its controls are live.
- assertVisible:
    id: 'intro-pager'
- assertVisible:
    id: 'intro-primary'
- tapOn:
    id: 'intro-secondary'

# The sign-in screen offers the routes this build actually has.
- assertVisible:
    id: 'sign-in-email'
- assertVisible:
    id: 'sign-in-demo'

# Email sign-in opens a real form and comes back.
- tapOn:
    id: 'sign-in-email'
- assertVisible:
    id: 'email-input'
- tapOn:
    id: 'screen-header-back'
- assertVisible:
    id: 'sign-in-demo'

# Demo mode needs no account and no network, and lands on a populated Today
# rather than in onboarding.
- tapOn:
    id: 'sign-in-demo'
- assertVisible: 'Bugün'
- assertVisible:
    id: 'briefing-hero'

# The four tabs each render their own screen.
- tapOn: 'Akış'
- assertVisible:
    id: 'flow-list'
- tapOn: 'Planla'
- assertVisible:
    id: 'plan-range'
- tapOn: 'Asistan'
- assertVisible:
    id: 'assistant-input'
- tapOn: 'Bugün'
- assertVisible:
    id: 'briefing-hero'
