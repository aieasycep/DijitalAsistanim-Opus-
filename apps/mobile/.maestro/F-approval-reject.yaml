# Flow F — the approval gate, refused.
#
# Refusing has to be as easy as approving, and a refused proposal must not come
# back. The reason is optional on purpose: making it mandatory only trains
# people to type anything to make the dialog go away.
#
# As in flow E, the queue's cards are not buttons — the full record is opened
# through the card's own "Düzenle" — and a decision does not navigate: the card
# stays put and changes state, which is what makes the refusal visible.
appId: ${APP_ID}
name: F · Reject an outbound action
tags:
  - smoke
---
- runFlow: helpers/enter-demo.yaml
- tapOn:
    id: 'approval-banner'
- assertVisible:
    id: 'approvals-tabs'
- assertVisible:
    id: 'approval-.*'
- scrollUntilVisible:
    element:
      text: 'Düzenle'
    direction: DOWN
- tapOn: 'Düzenle'
- assertVisible:
    id: 'approval-detail-card'

- scrollUntilVisible:
    element:
      text: 'Reddet'
    direction: DOWN
- tapOn: 'Reddet'

# Refused, on the record, with nothing sent.
- assertNotVisible: 'Onayla'
- scrollUntilVisible:
    element:
      text: 'Reddedildi'
    direction: UP
- assertVisible: 'Reddedildi'
- scrollUntilVisible:
    element:
      id: 'approval-close'
    direction: DOWN
- tapOn:
    id: 'approval-close'
- assertVisible:
    id: 'approvals-tabs'

# The history keeps the record, and offers no way to approve after the fact.
- tapOn: 'Geçmiş'
- assertVisible:
    id: 'approval-.*'
- assertNotVisible: 'Onayla'
